[project]
name = "codepilot-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "deepagents>=0.6.12",
    "fastapi>=0.141.1",
    "langchain-anthropic>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "langsmith>=0.10.10",
    "nemoguardrails>=0.23.0",
    "pydantic-settings>=2.14.2",
    "pygithub>=2.9.1",
    "textual>=8.2.8",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

